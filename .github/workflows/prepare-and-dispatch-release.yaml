name: Prepare and dispatch release

# NOTE: Shared release workflow of repositories which only declare their
# triggers and call this workflow. Prepares a new version of the calling
# repository via this action and notifies it with a "prepare-release-event"
# (or "prepare-pre-release-event" for candidates) repository dispatch, which
# carries the new version as "version" in its client payload.
on:
  workflow_call:
    inputs:
      debug:
        description: Sets "NODE_ENV" to "debug".
        default: false
        type: boolean
      type:
        description: |
          Sets semantic version update type: "major", "minor", "patch" or
          "candidate". Defaults to "patch".
        type: string

    outputs:
      version:
        description: The newly determined version.
        value: ${{ jobs.main.outputs.version }}

jobs:
  main:
    runs-on: ubuntu-latest
    container: node:lts
    # Allows pushing the version bump with its tag and dispatching the release
    # event.
    permissions:
      contents: write

    outputs:
      version: ${{ steps.prepare-release.outputs.version }}

    steps:
      - uses: thaibault/prepare-release-action@main
        id: prepare-release
        with:
          debug: ${{ inputs.debug }}
          type: ${{ inputs.type || 'patch' }}

      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: prepare-${{ inputs.type == 'candidate' && 'pre-' || '' }}release-event
          client-payload: '{"version": "${{ steps.prepare-release.outputs.version }}"}'
